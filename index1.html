<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Project Prometheus — NCC ANO Assistance System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#f6f8fb; --surface:#ffffff; --surface-2:#f1f5f9; --surface-sunk:#eef2f7;
  --border:#e2e8f0; --border-strong:#cbd5e1;
  --text:#0f172a; --text-soft:#475569; --text-mute:#94a3b8;
  --blue:#2554e0; --blue-dark:#1c3fb0; --blue-soft:#eaf0ff; --blue-ring:#c7d8ff;
  --emerald:#04815c; --emerald-dark:#036347; --emerald-soft:#e3f7ef;
  --amber:#b5690a; --amber-soft:#fff2df;
  --red:#c22036; --red-soft:#fdeced;
  --radius-sm:8px; --radius:12px; --radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow:0 2px 8px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 12px 32px rgba(15,23,42,.10), 0 2px 8px rgba(15,23,42,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"JetBrains Mono","SFMono-Regular",Consolas,"Roboto Mono",monospace;
  --topbar-h:60px; --sidebar-w:248px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
  -webkit-font-smoothing:antialiased; font-size:14.5px; line-height:1.5;
}
h1,h2,h3,h4,p,ul{margin:0;}
ul{padding:0;list-style:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:inherit;}
a{color:inherit;}
img{max-width:100%;display:block;}
::selection{background:var(--blue-ring);}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

/* ============ UTILITY ============ */
.mono{font-family:var(--mono);}
.muted{color:var(--text-soft);}
.mute2{color:var(--text-mute);}
.flex{display:flex;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.gap-1{gap:6px;} .gap-2{gap:10px;} .gap-3{gap:16px;} .gap-4{gap:24px;}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:960px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
@media(max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
.w-full{width:100%;}
.mt-1{margin-top:8px;} .mt-2{margin-top:16px;} .mt-3{margin-top:24px;}
.mb-1{margin-bottom:8px;} .mb-2{margin-bottom:16px;} .mb-3{margin-bottom:24px;}
.hidden{display:none !important;}
.scroll-y{overflow-y:auto;}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;}

/* ============ TYPE ============ */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--blue);font-weight:700;}
.h1{font-size:26px;font-weight:800;letter-spacing:-.01em;color:var(--text);}
.h2{font-size:20px;font-weight:750;letter-spacing:-.01em;color:var(--text);}
.h3{font-size:15.5px;font-weight:700;color:var(--text);}
.stat-num{font-family:var(--mono);font-weight:700;font-size:28px;color:var(--text);}
.section-title{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.section-title .h2{flex:1;}

/* ============ SPLASH ============ */
#splash{
  position:fixed;inset:0;background:
    radial-gradient(circle at 30% 20%, #eef4ff 0%, transparent 45%),
    radial-gradient(circle at 80% 80%, #e6faf1 0%, transparent 45%),
    #ffffff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:9999; transition:opacity .5s ease;
}
#splash.fade-out{opacity:0;pointer-events:none;}
.flame-mark{width:64px;height:64px;margin-bottom:22px;animation:flamePulse 2.2s ease-in-out infinite;}
@keyframes flamePulse{0%,100%{transform:scale(1);opacity:.92;}50%{transform:scale(1.06);opacity:1;}}
.splash-title{font-size:34px;font-weight:800;letter-spacing:.02em;color:var(--text);opacity:0;animation:riseIn .7s ease .15s forwards;}
.splash-sub{font-family:var(--mono);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin-top:10px;opacity:0;animation:riseIn .7s ease .5s forwards;}
.splash-tag{color:var(--text-mute);font-size:12.5px;margin-top:6px;opacity:0;animation:riseIn .7s ease .75s forwards;}
@keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.splash-bar{width:220px;height:3px;background:var(--surface-2);border-radius:2px;margin-top:34px;overflow:hidden;border:1px solid var(--border);}
.splash-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--emerald));animation:loadBar 2.3s ease forwards .3s;}
@keyframes loadBar{to{width:100%;}}

/* ============ LOGIN / MODE SELECT ============ */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
    radial-gradient(circle at 15% 10%, #eef4ff 0%, transparent 40%),
    radial-gradient(circle at 90% 90%, #e6faf1 0%, transparent 40%), var(--bg);padding:24px;}
.login-card{width:100%;max-width:860px;}
.brand-row{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:34px;}
.brand-row .flame-mark{width:34px;height:34px;margin:0;animation:none;}
.brand-name{font-weight:800;font-size:19px;}
.brand-sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--blue);text-transform:uppercase;}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:720px){.mode-grid{grid-template-columns:1fr;}}
.mode-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;cursor:pointer;transition:.18s;position:relative;overflow:hidden;}
.mode-card:hover{border-color:var(--blue);box-shadow:var(--shadow-lg);transform:translateY(-2px);}
.mode-card .corner{position:absolute;top:14px;right:14px;width:22px;height:22px;border-top:2px solid var(--border-strong);border-right:2px solid var(--border-strong);opacity:.6;}
.mode-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px;}
.mode-icon.blue{background:var(--blue-soft);}
.mode-icon.emerald{background:var(--emerald-soft);}
.login-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;margin-top:20px;box-shadow:var(--shadow);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.input,.select,.textarea{width:100%;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);transition:.15s;}
.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-ring);outline:none;}
.textarea{resize:vertical;min-height:80px;}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--radius-sm);padding:9px 16px;font-weight:650;font-size:13.5px;border:1px solid transparent;transition:.15s;white-space:nowrap;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--blue-dark);}
.btn-emerald{background:var(--emerald);color:#fff;}
.btn-emerald:hover{background:var(--emerald-dark);}
.btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border-strong);}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue);}
.btn-danger{background:var(--red-soft);color:var(--red);border-color:#f3c6cb;}
.btn-danger:hover{background:#fbdadd;}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn-lg{padding:12px 22px;font-size:14.5px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.icon-btn{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-soft);flex-shrink:0;}
.icon-btn:hover{border-color:var(--blue);color:var(--blue);}
.icon-btn.active{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);}

/* ============ APP SHELL ============ */
#appShell{display:none;min-height:100vh;}
#appShell.show{display:block;}
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:14px;z-index:500;}
.topbar-brand{display:flex;align-items:center;gap:9px;width:var(--sidebar-w);flex-shrink:0;}
.topbar-brand .flame-mark{width:24px;height:24px;margin:0;animation:none;}
.topbar-title{font-weight:800;font-size:14.5px;line-height:1.15;}
.topbar-title small{display:block;font-family:var(--mono);font-size:9px;color:var(--blue);letter-spacing:.1em;font-weight:700;}
.topbar-spacer{flex:1;}
.mode-chip{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:5px 10px;border-radius:20px;text-transform:uppercase;}
.mode-chip.pc{background:var(--blue-soft);color:var(--blue-dark);}
.mode-chip.kiosk{background:var(--emerald-soft);color:var(--emerald-dark);}
.lang-select{border:1px solid var(--border-strong);border-radius:8px;padding:7px 10px;background:var(--surface);font-size:12.5px;font-weight:600;color:var(--text-soft);}
.offline-dot{width:8px;height:8px;border-radius:50%;background:var(--emerald);flex-shrink:0;}
.offline-dot.off{background:var(--text-mute);}
.profile-chip{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);}
.profile-avatar{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}

.sidebar{position:fixed;top:var(--topbar-h);left:0;bottom:0;width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);padding:16px 10px;overflow-y:auto;z-index:400;}
.nav-group-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mute);padding:14px 12px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--text-soft);font-weight:600;font-size:13.5px;margin-bottom:2px;transition:.12s;}
.nav-item .ic{width:18px;text-align:center;flex-shrink:0;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--blue-soft);color:var(--blue-dark);}
.nav-sub{padding-left:30px;}

.main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);padding:26px 28px 60px;max-width:1280px;}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);transition:.2s;box-shadow:var(--shadow-lg);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;padding:18px 16px 80px;}
  .topbar-brand{width:auto;}
}

/* ============ CARDS / BADGES / MISC ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
.card-tight{padding:14px 16px;}
.tframe{position:relative;}
.tframe::before,.tframe::after{content:'';position:absolute;width:14px;height:14px;border-color:var(--border-strong);opacity:.7;}
.tframe::before{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid;border-top-left-radius:6px;}
.tframe::after{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid;border-bottom-right-radius:6px;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.02em;}
.badge-blue{background:var(--blue-soft);color:var(--blue-dark);}
.badge-emerald{background:var(--emerald-soft);color:var(--emerald-dark);}
.badge-amber{background:var(--amber-soft);color:var(--amber);}
.badge-red{background:var(--red-soft);color:var(--red);}
.badge-gray{background:var(--surface-2);color:var(--text-soft);}
.progress{height:8px;background:var(--surface-sunk);border-radius:6px;overflow:hidden;border:1px solid var(--border);}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--emerald));border-radius:6px;transition:width .5s ease;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;}
.tab{padding:9px 15px;font-weight:650;font-size:13.5px;color:var(--text-soft);border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--blue);border-color:var(--blue);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-mute);padding:8px 12px;border-bottom:1px solid var(--border);font-family:var(--mono);}
td{padding:11px 12px;border-bottom:1px solid var(--border);color:var(--text);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface-2);}
.subj-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;transition:.15s;cursor:pointer;}
.subj-card:hover{border-color:var(--blue);box-shadow:var(--shadow-lg);transform:translateY(-2px);}
.subj-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px;}

/* ============ TOAST ============ */
#toastRoot{position:fixed;bottom:22px;right:22px;z-index:9998;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--text);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;animation:toastIn .25s ease;max-width:340px;}
.toast.success{background:var(--emerald-dark);}
.toast.error{background:var(--red);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ============ MODAL ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px;}
.modal{background:var(--surface);border-radius:var(--radius-lg);max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-body{padding:20px;}

/* ============ SESSION ============ */
.phase-stepper{display:flex;gap:8px;margin-bottom:22px;}
.phase-step{flex:1;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);}
.phase-step .pn{font-family:var(--mono);font-size:10px;color:var(--text-mute);}
.phase-step .pt{font-weight:700;font-size:12.5px;margin-top:2px;}
.phase-step.active{border-color:var(--blue);background:var(--blue-soft);}
.phase-step.active .pn{color:var(--blue);}
.phase-step.done{border-color:var(--emerald);background:var(--emerald-soft);}
.session-timer{font-family:var(--mono);font-size:15px;font-weight:700;padding:7px 13px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);}
.session-timer.low{color:var(--red);background:var(--red-soft);border-color:#f3c6cb;}

.audio-bar{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.seek-track{height:6px;background:var(--surface-sunk);border:1px solid var(--border);border-radius:6px;position:relative;cursor:pointer;margin:12px 0 6px;}
.seek-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--emerald));border-radius:6px;width:0%;pointer-events:none;}
.seek-thumb{position:absolute;top:50%;width:14px;height:14px;background:#fff;border:2px solid var(--blue);border-radius:50%;transform:translate(-50%,-50%);left:0%;box-shadow:var(--shadow-sm);pointer-events:none;}

.flashcard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:720px){.flashcard-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.flashcard-grid{grid-template-columns:1fr;}}
.flashcard{perspective:1200px;height:130px;}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer;}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
.flashcard-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid var(--border);}
.flashcard-front{background:var(--surface);}
.flashcard-front .term{font-weight:750;font-size:14.5px;}
.flashcard-back{background:var(--blue-soft);transform:rotateY(180deg);}
.flashcard-back .def{font-size:12px;color:var(--text-soft);line-height:1.45;}

.quiz-option{display:flex;align-items:center;gap:11px;padding:13px 15px;border:1.5px solid var(--border-strong);border-radius:10px;margin-bottom:9px;cursor:pointer;transition:.12s;}
.quiz-option:hover{border-color:var(--blue);}
.quiz-option.selected{border-color:var(--blue);background:var(--blue-soft);}
.quiz-option.correct{border-color:var(--emerald);background:var(--emerald-soft);}
.quiz-option.wrong{border-color:var(--red);background:var(--red-soft);}
.opt-letter{width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:12px;flex-shrink:0;}
.quiz-option.selected .opt-letter{background:var(--blue);color:#fff;}
.quiz-option.correct .opt-letter{background:var(--emerald);color:#fff;}
.quiz-option.wrong .opt-letter{background:var(--red);color:#fff;}

.grade-badge{display:inline-flex;flex-direction:column;align-items:center;padding:22px 30px;border-radius:16px;border:1.5px solid;}
.grade-badge.a{background:var(--emerald-soft);border-color:var(--emerald);}
.grade-badge.b{background:var(--blue-soft);border-color:var(--blue);}
.grade-badge.c{background:var(--amber-soft);border-color:var(--amber);}
.grade-badge.d{background:var(--red-soft);border-color:var(--red);}
.grade-letter{font-family:var(--mono);font-size:40px;font-weight:800;}
.grade-label{font-weight:750;font-size:13px;letter-spacing:.04em;margin-top:4px;text-transform:uppercase;}

.chat-panel{display:flex;flex-direction:column;height:420px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface);}
.chat-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
.chat-bubble{max-width:78%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.5;}
.chat-ai{background:var(--surface-2);align-self:flex-start;border-bottom-left-radius:4px;}
.chat-user{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.chat-input-row{border-top:1px solid var(--border);padding:10px;display:flex;gap:8px;}

.diagram-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.terrain3d{perspective:900px;}
.terrain3d-inner{transform:rotateX(46deg) rotateZ(0deg);transform-style:preserve-3d;transition:transform .1s;cursor:grab;}
.terrain3d-inner:active{cursor:grabbing;}

.kiosk-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px 18px;text-align:center;cursor:pointer;transition:.15s;}
.kiosk-tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--blue);}
.kiosk-tile .subj-icon{margin:0 auto 12px;}

.fab{position:fixed;bottom:22px;left:calc(var(--sidebar-w) + 26px);width:52px;height:52px;border-radius:50%;background:var(--text);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:var(--shadow-lg);z-index:600;border:none;transition:.15s;}
.fab.listening{background:var(--red);animation:pulseFab 1.2s infinite;}
@keyframes pulseFab{0%,100%{box-shadow:0 0 0 0 rgba(194,32,54,.4);}50%{box-shadow:0 0 0 12px rgba(194,32,54,0);}}
@media(max-width:900px){.fab{left:20px;}}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-mute);}
.empty-state .ic{font-size:30px;margin-bottom:10px;}

.scan-ring{width:64px;height:64px;border-radius:50%;border:3px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto;transition:.2s;}
.scan-ring.scanning{border-color:var(--blue);animation:scanPulse 1s infinite;}
.scan-ring.done{border-color:var(--emerald);background:var(--emerald-soft);}

const $  = (sel, root=document) => root.querySelector(sel);

function uid(){ return 'id' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ try{ return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return d; } }
function fmtTime(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function toast(msg, type){
  const root = $('#toastRoot');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  el.innerHTML = (type==='success'?'✓ ':type==='error'?'⚠ ':'ℹ ') + escapeHtml(msg);
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(6px)'; el.style.transition='.25s'; setTimeout(()=>el.remove(),260); }, 3200);

/* ---------- persistent storage helpers (window.storage) ---------- */
async function loadData(key, fallback, shared){
  if(shared===undefined) shared=true;
  try{
    const r = await window.storage.get(key, shared);
    if(!r || r.value===undefined) return fallback;
    return JSON.parse(r.value);
  }catch(e){ return fallback; }
}
async function saveData(key, value, shared){
  if(shared===undefined) shared=true;
  try{ await window.storage.set(key, JSON.stringify(value), shared); return true; }
  catch(e){ console.warn('storage save failed', key, e); return false; }
}

/* ---------- Claude API bridge (in-artifact) ---------- */
async function callClaude(system, userContentOrMessages, opts){
  opts = opts || {};
  try{
    const messages = Array.isArray(userContentOrMessages) ? userContentOrMessages : [{role:'user', content: userContentOrMessages}];
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: system,
        messages: messages
      })
    });
    const data = await resp.json();
    if(!data || !data.content) throw new Error('no content');
    const text = data.content.filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
    if(!text) throw new Error('empty response');
    if(opts.json){
      const cleaned = text.replace(/```json/gi,'').replace(/```/g,'').trim();
      const start = cleaned.indexOf(cleaned.trim()[0]==='[' ? '[' : '{');
      return JSON.parse(cleaned.slice(start));
    }
    return text;
  }catch(e){
    console.warn('Claude call failed / offline:', e.message);
    return null;
  }
}

/* ---------- Router ---------- */
function goto(screen, opts){
  STATE.screen = screen;
  if(opts) Object.assign(STATE, opts);
  STATE.sidebarOpen = false;
  render();
  window.scrollTo(0,0);
}
function render(){
  const root = $('#app');
  if(STATE.screen==='login'){ root.innerHTML = screenLogin(); return; }
  root.innerHTML = appShellHtml();
  afterShellRender();
}
function afterShellRender(){
  const body = $('#screenBody');
  if(!body) return;
  const fn = SCREEN_RENDERERS[STATE.screen];
  body.innerHTML = fn ? fn() : emptyState('Screen not found');
  if(SCREEN_AFTER && SCREEN_AFTER[STATE.screen]) SCREEN_AFTER[STATE.screen]();
}

/* ---------- AI content helpers (all degrade gracefully to baseline content) ---------- */
async function aiGenerateNotes(subject){
  if(STATE.offline) return null;
  const sys = 'You are an expert NCC (National Cadet Corps, India) instructor writing lecture notes for cadet training sessions. Write clear, factual, structured training content only. Never include weapon assembly, firing, or operational combat instructions.';
  const usr = `Write concise lecture notes (about 380-450 words total) for the NCC subject "${subject.name}". Cover these sections: ${subject.notes.map(n=>n.heading).join(', ')}. Return ONLY a JSON array like [{"heading":"...","body":"..."}] with one object per section, no markdown fences, no commentary.`;
  const result = await callClaude(sys, usr, {json:true});
  if(Array.isArray(result) && result.length>0 && result[0].heading) return result;
  return null;
}
async function aiGenerateQuiz(subject, notesText){
  if(STATE.offline) return null;
  const sys = 'You are an NCC training assessment generator. Output ONLY valid JSON, nothing else. Never reference weapon operation, firing, or combat tactics beyond standard field-craft awareness.';
  const usr = `Based on this "${subject.name}" NCC training material:\n\n${notesText.slice(0,2800)}\n\nGenerate exactly 5 fresh multiple-choice questions as a JSON array. Each item: {"q":"...","options":["a","b","c","d"],"correct":0,"rationale":"one short sentence"}. Vary from obvious textbook phrasing.`;
  const result = await callClaude(sys, usr, {json:true});
  if(Array.isArray(result) && result.length>=4) return result.slice(0,5);
  return null;
}
async function aiAskDoubt(subject, contextNotes, history, question){
  if(STATE.offline) return null;
  const sys = `You are a patient, encouraging NCC training assistant helping a cadet or ANO with doubts about "${subject.name}". Keep answers to 2-4 concise sentences, grounded in standard NCC training knowledge. Context notes for this session:\n${contextNotes.slice(0,2200)}\n\nNever provide weapon assembly, firing, or operational combat instructions — redirect such questions to the unit's ANO/range safety staff.`;
  const messages = history.concat([{role:'user', content:question}]).map(m=>({role:m.role, content:m.content}));
  const result = await callClaude(sys, messages);
  return result;
}
async function aiTranslate(text, langCode){
  if(STATE.offline || langCode==='en') return null;
  const cacheKey = langCode+'::'+text.slice(0,60);
  if(STATE.aiCache[cacheKey]) return STATE.aiCache[cacheKey];
  const sys = `You are a professional translator for NCC (National Cadet Corps) training material, translating into ${LANGS[langCode]}. Preserve meaning and structure. Output ONLY the translated text, no notes or preamble.`;
  const result = await callClaude(sys, text);
  if(result) STATE.aiCache[cacheKey] = result;
  return result;
}
async function aiSummarizeText(text){
  if(STATE.offline) return null;
  const sys = 'You produce concise executive summaries of documents for a busy NCC ANO. Output ONLY a JSON array of 5-7 short bullet-point strings, no markdown fences.';
  const usr = `Summarize this document:\n\n${text.slice(0,6500)}`;
  const result = await callClaude(sys, usr, {json:true});
  if(Array.isArray(result)) return result;
  return null;
}
async function aiQuizFromText(text){
  if(STATE.offline) return null;
  const sys = 'You generate assessment questions from arbitrary reference material for NCC training. Output ONLY valid JSON.';
  const usr = `From this document text:\n\n${text.slice(0,6500)}\n\nGenerate exactly 5 multiple-choice questions as JSON array: [{"q":"...","options":["a","b","c","d"],"correct":0,"rationale":"..."}].`;
  const result = await callClaude(sys, usr, {json:true});
  if(Array.isArray(result) && result.length>=3) return result.slice(0,5);
  return null;
}
async function aiChatOnDoc(docText, history, question){
  if(STATE.offline) return null;
  const sys = `Answer questions grounded strictly in the following uploaded document. Be concise (2-4 sentences). If the answer is not in the document, say so plainly.\n\nDOCUMENT:\n${docText.slice(0,6500)}`;
  const messages = history.concat([{role:'user', content:question}]).map(m=>({role:m.role, content:m.content}));
  return await callClaude(sys, messages);
}

/* ---------- shared small helpers used across screens ---------- */
function subjectList(){ return ['HH','MR','FCBC','GA']; }
function syllabusPctFor(key){
  const mp = STATE.moduleProgress && STATE.moduleProgress[key];
  if(mp && typeof mp.syllabusPct==='number') return mp.syllabusPct;
  return {HH:72,MR:58,FCBC:84,GA:45}[key] || 50;
}
function avgSyllabusPct(){
  const vals = subjectList().map(syllabusPctFor);
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function budgetRemaining(){
  if(!STATE.finance) return 0;
  const spent = STATE.finance.expenditures.reduce((a,e)=>a+Number(e.amount||0),0);
  return STATE.finance.budget - spent;
}
function upcomingEvents(n){
  const today = new Date().toISOString().slice(0,10);
  return (STATE.events||[]).filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,n||3);
}
function statusBadge(status){
  const map = {active:['badge-emerald','Active'], new:['badge-blue','New Joinee'], dropout:['badge-red','Dropout'], camp:['badge-amber','In Camp']};
  const m = map[status]||['badge-gray',status];
  return `<span class="badge ${m[0]}">${m[1]}</span>`;
}

/* ======================= SESSION ENGINE — SETUP ======================= */
async function startSession(key){
  const s = CONTENT[key];
  STATE.session = {
    subject:key, phase:1, phase1Tab:'notes',
    notes: s.notes.slice(), notesSource:'baseline', sentences:[],
    audioPlaying:false, audioIdx:0,
    flashFlipped:{},
    quiz: s.quiz.map(q=>({...q})), quizSource:'baseline', currentQ:0,
    answers: s.quiz.map(()=>null), submitted:false, score:0, _quizFetched:false,
    chatHistory:[], timeLeft:1200, timerInterval:null, startedAt:Date.now()
  };
  buildSentences();
  goto('session');
  startPhaseTimer();
}
function buildSentences(){
  const text = STATE.session.notes.map(n=>n.heading+'. '+n.body).join(' ');
  const raw = text.match(/[^.!?]+[.!?]+/g) || [text];
  STATE.session.sentences = raw.map(x=>x.trim()).filter(Boolean);
  STATE.session.audioIdx = 0;
}
function startPhaseTimer(){
  stopPhaseTimer();
  const durations = {1:1200,2:600,3:300,4:300};
  STATE.session.timeLeft = durations[STATE.session.phase];
  STATE.session.timerInterval = setInterval(()=>{
    if(!STATE.session) return stopPhaseTimer();
    STATE.session.timeLeft--;
    const label = $('#sessionTimerLabel'); const wrap = $('#sessionTimerWrap');
    if(label){ label.textContent = fmtTime(STATE.session.timeLeft); }
    if(wrap){ wrap.classList.toggle('low', STATE.session.timeLeft<=30); }
    if(STATE.session.timeLeft<=0){ stopPhaseTimer(); toast('Time guide for this phase is up — continue when ready','info'); }
  },1000);
}
function stopPhaseTimer(){ if(STATE.session && STATE.session.timerInterval){ clearInterval(STATE.session.timerInterval); STATE.session.timerInterval=null; } }
function sessionGoPhase(n){
  audioStop();
  STATE.session.phase = n;
  if(n===2 && !STATE.session._quizFetched){ STATE.session._quizFetched = true; tryFetchFreshQuiz(); }
  afterShellRender();
  startPhaseTimer();
}
async function tryFetchFreshQuiz(){
  const notesText = STATE.session.notes.map(x=>x.heading+': '+x.body).join(' ');
  const fresh = await aiGenerateQuiz(CONTENT[STATE.session.subject], notesText);
  if(fresh && STATE.session && STATE.session.phase===2 && !STATE.session.submitted){
    STATE.session.quiz = fresh; STATE.session.quizSource = 'ai';
    STATE.session.answers = fresh.map(()=>null);
    if(STATE.screen==='session') afterShellRender();
  }
}

/* ---------- Audio bar (Web Speech API, sentence-level seek) ---------- */
let SEEK_DRAGGING = false;
window.addEventListener('mousemove', e=>{ if(SEEK_DRAGGING) handleSeekClick(e); });
window.addEventListener('mouseup', ()=> SEEK_DRAGGING=false);
window.addEventListener('touchmove', e=>{ if(SEEK_DRAGGING) handleSeekTouch(e); }, {passive:true});
window.addEventListener('touchend', ()=> SEEK_DRAGGING=false);

function sess_toggleAudio(){
  if(!('speechSynthesis' in window)){ toast('Speech synthesis is not supported in this browser','error'); return; }
  const sess = STATE.session;
  if(sess.audioPlaying){ audioPause(); }
  else if(speechSynthesis.paused && speechSynthesis.speaking){ audioResume(); }
  else { audioPlay(); }
}
function audioPlay(){
  const sess = STATE.session; if(!sess || !sess.sentences.length) return;
  speechSynthesis.cancel();
  sess.audioPlaying = true;
  speakFrom(sess.audioIdx);
}
function speakFrom(i){
  const sess = STATE.session; if(!sess) return;
  if(i>=sess.sentences.length){ sess.audioPlaying=false; sess.audioIdx=0; updateAudioUI(); return; }
  sess.audioIdx = i;
  const u = new SpeechSynthesisUtterance(sess.sentences[i]);
  u.lang = ({en:'en-IN',hi:'hi-IN',kn:'kn-IN',ta:'ta-IN',te:'te-IN'})[STATE.language] || 'en-IN';
  u.rate = 0.98;
  u.onend = () => { if(STATE.session && STATE.session.audioPlaying) speakFrom(i+1); };
  speechSynthesis.speak(u);
  updateAudioUI();
}
function audioPause(){ if(speechSynthesis.speaking){ speechSynthesis.pause(); STATE.session.audioPlaying=false; updateAudioUI(); } }
function audioResume(){ if(speechSynthesis.paused){ speechSynthesis.resume(); STATE.session.audioPlaying=true; updateAudioUI(); } }
function audioStop(){ if('speechSynthesis' in window) speechSynthesis.cancel(); if(STATE.session){ STATE.session.audioPlaying=false; STATE.session.audioIdx=0; } updateAudioUI(); }
function audioReplay(){ if(!STATE.session) return; speechSynthesis.cancel(); STATE.session.audioIdx=0; STATE.session.audioPlaying=true; speakFrom(0); }
function handleSeekClick(e){ const track=$('#seekTrack'); if(!track) return; const rect=track.getBoundingClientRect(); audioSeek(clamp((e.clientX-rect.left)/rect.width,0,1)); }
function handleSeekTouch(e){ const track=$('#seekTrack'); if(!track || !e.touches[0]) return; const rect=track.getBoundingClientRect(); audioSeek(clamp((e.touches[0].clientX-rect.left)/rect.width,0,1)); }
function audioSeek(frac){
  const sess = STATE.session; if(!sess || !sess.sentences.length) return;
  const idx = clamp(Math.round(frac*(sess.sentences.length-1)),0,sess.sentences.length-1);
  const wasPlaying = sess.audioPlaying;
  speechSynthesis.cancel();
  sess.audioIdx = idx;
  if(wasPlaying) speakFrom(idx); else updateAudioUI();
}
function updateAudioUI(){
  const sess = STATE.session; if(!sess) return;
  const fill=$('#seekFill'), thumb=$('#seekThumb'), label=$('#audioTimeLabel'), btn=$('#audioPlayBtn');
  if(!fill) return;
  const pct = sess.sentences.length>1 ? (sess.audioIdx/(sess.sentences.length-1))*100 : 0;
  fill.style.width = pct+'%'; thumb.style.left = pct+'%';
  if(label) label.textContent = (sess.audioIdx+1)+' / '+sess.sentences.length;
  if(btn) btn.textContent = sess.audioPlaying ? '⏸' : '▶';
}

    ${q.options.map((opt,i)=>`
      <div class="quiz-option ${sess.answers[sess.currentQ]===i?'selected':''}" onclick="selectAnswer(${i})">

function selectAnswer(i){ STATE.session.answers[STATE.session.currentQ] = i; afterShellRender(); }
function finalizeQuiz(){
  const sess = STATE.session;
  let score = 0;
  sess.quiz.forEach((q,i)=>{ if(sess.answers[i]===q.correct) score++; });
  sess.score = score; sess.submitted = true;
  saveModuleAttempt(sess.subject, score, sess.quiz.length);
  afterShellRender();
}
function gradeFor(score,total){
  const pct = score/total;
  if(score===total) return {label:'COMBAT READY', grade:'A+', cls:'a'};
  if(pct>=0.8) return {label:'COMBAT READY', grade:'A', cls:'a'};
  if(pct>=0.6) return {label:'FIELD READY', grade:'B', cls:'b'};
  if(pct>=0.4) return {label:'REQUIRES DRILLING', grade:'C', cls:'c'};
  return {label:'STAND DOWN - RETRAIN', grade:'D', cls:'d'};
}
async function saveModuleAttempt(key, score, total){
  if(!STATE.moduleProgress) STATE.moduleProgress = {};
  if(!STATE.moduleProgress[key]) STATE.moduleProgress[key] = {attempts:[], syllabusPct: syllabusPctFor(key)};
  STATE.moduleProgress[key].attempts.push({date:new Date().toISOString().slice(0,10), score:score, total:total});
  STATE.moduleProgress[key].syllabusPct = Math.min(100, (STATE.moduleProgress[key].syllabusPct||50) + 4);
  await saveData('moduleProgress', STATE.moduleProgress, true);
}

/* ======================= CUSTOM PDF VAULT ======================= */
async function handlePdfUpload(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  if(!file.name.toLowerCase().endsWith('.pdf')){ toast('Please upload a PDF file','error'); return; }
  toast('Reading PDF...', 'info');
  try{
    if(!window.pdfjsLib){ toast('PDF reader unavailable - check your internet connection','error'); return; }
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const buf = await file.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
    let fullText = '';
    const maxPages = Math.min(pdf.numPages, 40);
    for(let p=1; p<=maxPages; p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      fullText += content.items.map(function(it){ return it.str; }).join(' ') + '\n';
      if(fullText.length>20000) break;
    }
    fullText = fullText.slice(0,18000);
    const entry = {id:uid(), name:file.name, text:fullText, uploadedBy:(STATE.profile&&STATE.profile.name)||'Unknown', date:new Date().toISOString().slice(0,10), summary:null, quiz:null, chatHistory:[]};
    STATE.pdfVault.unshift(entry);
    await saveData('pdfVault', STATE.pdfVault, true);
    STATE.pdfVaultSelected = entry.id; STATE.pdfVaultTab = 'summary';
    toast('PDF uploaded and indexed', 'success');
    afterShellRender();
  }catch(e){
    console.error(e);
    toast('Could not read this PDF file', 'error');
  }
}

function tagEventLocation(id){
  if(!navigator.geolocation){ toast('Geolocation not available in this browser','error'); return; }
  toast('Requesting location...','info');
  navigator.geolocation.getCurrentPosition(async function(pos){
    const e = STATE.events.find(function(x){ return x.id===id; }); if(!e) return;
    e.geo = pos.coords.latitude.toFixed(4)+', '+pos.coords.longitude.toFixed(4);
    await saveData('events', STATE.events, true);
    toast('Location tagged','success'); afterShellRender();
  }, function(){ toast('Location permission denied','error'); });
}
function exportIcs(id){
  const e = STATE.events.find(function(x){ return x.id===id; }); if(!e) return;
  const dt = e.date.replace(/-/g,'');
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Project Prometheus//NCC ANO System//EN','BEGIN:VEVENT','UID:'+e.id+'@prometheus-ncc','DTSTAMP:'+dt+'T090000Z','DTSTART;VALUE=DATE:'+dt,'SUMMARY:'+e.title,'LOCATION:'+(e.location||''),'DESCRIPTION:'+e.type+' - synced from Project Prometheus NCC ANO System','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'Prometheus-Event-'+e.title.replace(/\s+/g,'-')+'.ics'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Calendar file downloaded - import into Google Calendar','success');
}

/* ======================= LANGUAGE, OFFLINE, VOICE (global controls) ======================= */
async function setLanguage(lang){
  STATE.language = lang;
  render();
  if(lang!=='en' && STATE.session && STATE.session.phase===1 && (STATE.session.phase1Tab||'notes')==='notes'){
    translateCurrentNotes(lang);
  }
}
async function translateCurrentNotes(lang){
  const sess = STATE.session; if(!sess) return;
  if(!sess.translatedNotes) sess.translatedNotes = {};
  if(sess.translatedNotes[lang]){ sess.notes = sess.translatedNotes[lang]; sess.notesSource='translated'; buildSentences(); afterShellRender(); return; }
  const source = CONTENT[sess.subject].notes;
  toast('Translating to '+LANGS[lang]+'...', 'info');
  const translated = [];
  for(let i=0; i<source.length; i++){
    const body = await aiTranslate(source[i].body, lang);
    const heading = await aiTranslate(source[i].heading, lang);
    translated.push({heading: heading || source[i].heading, body: body || source[i].body});
  }
  sess.translatedNotes[lang] = translated;
  if(STATE.language===lang && STATE.session===sess){
    sess.notes = translated; sess.notesSource = 'translated'; buildSentences(); afterShellRender();
    toast('Notes translated to '+LANGS[lang], 'success');
  }
}
function toggleOffline(){
  STATE.offline = !STATE.offline;
  toast(STATE.offline ? 'Offline mode enabled - using cached content only' : 'Offline mode disabled - live AI features active', STATE.offline?'info':'success');
  render();
}
window.addEventListener('offline', function(){ STATE.offline = true; if(STATE.screen!=='login') render(); });

let RECOGNIZER = null;
function toggleVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Voice control is not supported in this browser - try Chrome','error'); return; }
  if(STATE.voiceOn){ if(RECOGNIZER){ try{ RECOGNIZER.stop(); }catch(e){} } STATE.voiceOn=false; render(); return; }
  RECOGNIZER = new SR();
  RECOGNIZER.lang = ({en:'en-IN',hi:'hi-IN',kn:'kn-IN',ta:'ta-IN',te:'te-IN'})[STATE.language] || 'en-IN';
  RECOGNIZER.continuous = false;
  RECOGNIZER.interimResults = false;
  RECOGNIZER.onresult = function(e){
    const transcript = e.results[0][0].transcript;
    toast('Heard: ' + transcript, 'info');
    handleVoiceCommand(transcript.toLowerCase());
  };
  RECOGNIZER.onerror = function(){ STATE.voiceOn=false; render(); };
  RECOGNIZER.onend = function(){ STATE.voiceOn=false; render(); };
  try{ RECOGNIZER.start(); STATE.voiceOn = true; render(); }
  catch(e){ toast('Could not start voice recognition','error'); }
}
function handleVoiceCommand(t){
  if(t.indexOf('dashboard')>-1 || t.indexOf('home')>-1){ goto(STATE.mode==='pc'?'pc-dashboard':'kiosk-dashboard'); return; }
  if(t.indexOf('health')>-1 || t.indexOf('hygiene')>-1){ goto('subject-home',{currentSubject:'HH'}); return; }
  if(t.indexOf('map')>-1){ goto('subject-home',{currentSubject:'MR'}); return; }
  if(t.indexOf('field craft')>-1 || t.indexOf('battle craft')>-1){ goto('subject-home',{currentSubject:'FCBC'}); return; }
  if(t.indexOf('awareness')>-1){ goto('subject-home',{currentSubject:'GA'}); return; }
  if(t.indexOf('roster')>-1){ if(STATE.mode==='pc'){ goto('pc-roster'); } return; }
  if(t.indexOf('vault')>-1 || t.indexOf('pdf')>-1){ goto('pdf-vault'); return; }
  if(t.indexOf('event')>-1 || t.indexOf('calendar')>-1){ goto('pc-events'); return; }
  if(t.indexOf('start') > -1 && STATE.currentSubject){ startSession(STATE.currentSubject); return; }
  if(t.indexOf('next') > -1 && STATE.session){ if(STATE.session.phase<4) sessionGoPhase(STATE.session.phase+1); return; }
  if((t.indexOf('read')>-1 || t.indexOf('play')>-1) && STATE.session && STATE.session.phase===1){ audioPlay(); return; }
  if((t.indexOf('pause')>-1 || t.indexOf('stop')>-1) && STATE.session){ audioPause(); return; }
  if(STATE.session && STATE.session.phase===4){
    const input = $('#chatInput'); if(input){ input.value = t; sendDoubt(); return; }
  }
  toast('Command not recognized - try "open dashboard" or "start map reading"', 'error');
}

/* ======================= BOOTSTRAP ======================= */
async function init(){
  try{
    STATE.cadets = await loadData('cadets', null, true);
    if(!STATE.cadets){ STATE.cadets = SEED_CADETS; await saveData('cadets', STATE.cadets, true); }
    STATE.finance = await loadData('finance', null, true);
    if(!STATE.finance){ STATE.finance = SEED_FINANCE; await saveData('finance', STATE.finance, true); }
    STATE.events = await loadData('events', null, true);
    if(!STATE.events){ STATE.events = SEED_EVENTS; await saveData('events', STATE.events, true); }
    STATE.achievements = await loadData('achievements', null, true);
    if(!STATE.achievements){ STATE.achievements = SEED_ACHIEVEMENTS; await saveData('achievements', STATE.achievements, true); }
    STATE.attendance = await loadData('attendance', [], true);
    STATE.documents = await loadData('documents', [], true);
    STATE.pdfVault = await loadData('pdfVault', [], true);
    STATE.moduleProgress = await loadData('moduleProgress', {}, true);
  }catch(e){
    console.warn('Seed load failed, using in-memory defaults', e);
    STATE.cadets = SEED_CADETS; STATE.finance = SEED_FINANCE; STATE.events = SEED_EVENTS;
    STATE.achievements = SEED_ACHIEVEMENTS; STATE.attendance = []; STATE.documents = []; STATE.pdfVault = []; STATE.moduleProgress = {};
  }
  finishSplash();
}
function finishSplash(){
  setTimeout(function(){
    const splash = $('#splash');
    if(splash){
      splash.classList.add('fade-out');
      setTimeout(function(){ splash.style.display = 'none'; }, 520);
    }
    render();
  }, 2400);
}
init();
